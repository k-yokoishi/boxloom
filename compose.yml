name: boxloom-dev

services:
  minecraft:
    image: boxloom-minecraft:local
    build:
      context: .
      dockerfile: docker/minecraft/Dockerfile
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.2"
      FABRIC_LOADER_VERSION: "0.19.3"
      MODS: |
        /boxloom/boxloom.jar
        https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.156.0%2B26.2/fabric-api-0.156.0%2B26.2.jar
        https://maven.fabricmc.net/net/fabricmc/fabric-language-kotlin/1.13.13%2Bkotlin.2.4.10/fabric-language-kotlin-1.13.13%2Bkotlin.2.4.10.jar
      ONLINE_MODE: "TRUE"
      ENFORCE_SECURE_PROFILE: "TRUE"
      ENABLE_RCON: "FALSE"
      MODE: "creative"
      DIFFICULTY: "peaceful"
      SPAWN_PROTECTION: "0"
      MEMORY: "${MINECRAFT_MEMORY:-2G}"
      BOXLOOM_BIND_HOST: "0.0.0.0"
      BOXLOOM_PORT: "28886"
      BOXLOOM_AUTH_TOKEN: "${BOXLOOM_AUTH_TOKEN:-boxloom-local-poc-token}"
    ports:
      - "${MINECRAFT_BIND_ADDRESS:-127.0.0.1}:${MINECRAFT_PORT:-25566}:25565"
    volumes:
      - minecraft-data:/data
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 2m
      interval: 10s
      timeout: 5s
      retries: 30
    stop_grace_period: 2m
    restart: unless-stopped

  code-server:
    image: boxloom-code-server:local
    build:
      context: .
      dockerfile: docker/code-server/Dockerfile
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      BOXLOOM_BASE_URL: "http://minecraft:28886"
      BOXLOOM_AUTH_TOKEN: "${BOXLOOM_AUTH_TOKEN:-boxloom-local-poc-token}"
      PYTHONPATH: "/home/coder/boxloom/sdks/python/src"
      PYTHONUNBUFFERED: "1"
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - none
      - --disable-workspace-trust
      - --disable-telemetry
      - /home/coder/boxloom/examples/python
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - .:/home/coder/boxloom
    restart: unless-stopped

volumes:
  minecraft-data:
