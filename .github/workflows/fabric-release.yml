name: Release Fabric mod

on:
  push:
    tags:
      - "fabric-v*"

permissions:
  contents: write

concurrency:
  group: fabric-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Fabric mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            server/*.gradle
            server/gradle.properties
            server/gradle/wrapper/gradle-wrapper.properties
            server/*/*.gradle

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#fabric-v}"
          configured_version="$(sed -n 's/^server_version=//p' server/gradle.properties)"

          if [[ -z "$version" || "$version" == "$GITHUB_REF_NAME" ]]; then
            echo "Expected a tag named fabric-v<version>, got $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if [[ "$version" != "$configured_version" ]]; then
            echo "Tag version $version does not match server_version $configured_version" >&2
            exit 1
          fi

          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' server/fabric/CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No release notes found for $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: server
        run: ./gradlew build --no-daemon

      - name: Locate release JAR
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          jar_path="server/fabric/build/libs/boxloom-${VERSION}.jar"
          if [[ ! -f "$jar_path" ]]; then
            echo "Expected release JAR not found: $jar_path" >&2
            exit 1
          fi

          echo "jar=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          JAR_PATH: ${{ steps.package.outputs.jar }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$JAR_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "boxloom Fabric Mod $VERSION" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false \
            --verify-tag
