name: Release Fabric mod

on:
  push:
    tags:
      - "fabric-v*"

permissions: {}

concurrency:
  group: fabric-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Fabric mod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            server/*.gradle
            server/gradle.properties
            server/gradle/wrapper/gradle-wrapper.properties
            server/*/*.gradle

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#fabric-v}"
          configured_version="$(sed -n 's/^server_version=//p' server/gradle.properties)"

          if [[ -z "$version" || "$version" == "$GITHUB_REF_NAME" ]]; then
            echo "Expected a tag named fabric-v<version>, got $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if [[ "$version" != "$configured_version" ]]; then
            echo "Tag version $version does not match server_version $configured_version" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag $GITHUB_REF_NAME must point to a commit on main" >&2
            exit 1
          fi

          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' server/fabric/CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No release notes found for $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: server
        run: ./gradlew build --no-daemon

      - name: Prepare release bundle
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          jar_path="server/fabric/build/libs/boxloom-${VERSION}.jar"
          if [[ ! -f "$jar_path" ]]; then
            echo "Expected release JAR not found: $jar_path" >&2
            exit 1
          fi

          mkdir -p release-bundle
          cp "$jar_path" "release-bundle/boxloom-${VERSION}.jar"
          cp release-notes.md release-bundle/release-notes.md

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fabric-release-${{ steps.metadata.outputs.version }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Fabric mod
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: fabric-release-${{ needs.build.outputs.version }}
          path: release-bundle

      - name: Create draft GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          JAR_PATH: release-bundle/boxloom-${{ needs.build.outputs.version }}.jar
          NOTES_PATH: release-bundle/release-notes.md
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" "$JAR_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "boxloom Fabric Mod $VERSION" \
            --notes-file "$NOTES_PATH" \
            --draft \
            --prerelease \
            --latest=false \
            --verify-tag

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
