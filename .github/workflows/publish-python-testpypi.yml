name: Publish Python SDK to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-python-testpypi
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/python

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          working-directory: sdks/python
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Synchronize the locked environment
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Build distributions
        run: uv build --clear

      - name: Smoke test the wheel
        run: uv run --isolated --no-project --with dist/*.whl python tests/smoke_test.py

      - name: Smoke test the source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz python tests/smoke_test.py

      - name: Publish distributions to TestPyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -z "${UV_PUBLISH_TOKEN}" ]; then
            echo "::error::Repository secret TEST_PYPI_API_TOKEN is not configured."
            exit 1
          fi

          uv publish --index testpypi dist/*
