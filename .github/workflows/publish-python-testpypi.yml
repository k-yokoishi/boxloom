name: Publish Python SDK to TestPyPI

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-python-testpypi
  cancel-in-progress: false

jobs:
  build:
    name: Build Python SDK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/python

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          working-directory: sdks/python
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Synchronize the locked environment
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Build distributions
        run: uv build --clear

      - name: Smoke test the wheel
        run: uv run --isolated --no-project --with dist/*.whl python tests/smoke_test.py

      - name: Smoke test the source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz python tests/smoke_test.py

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: sdks/python/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Python SDK to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      contents: read

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-distributions
          path: sdks/python/dist

      - name: Publish distributions to TestPyPI
        working-directory: sdks/python
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -z "${UV_PUBLISH_TOKEN}" ]; then
            echo "::error::Repository secret TEST_PYPI_API_TOKEN is not configured."
            exit 1
          fi

          uv publish --index testpypi dist/*
