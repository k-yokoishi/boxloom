plugins {
    id "net.fabricmc.fabric-loom"
    id "org.jetbrains.kotlin.jvm"
}

base {
    archivesName = project.fabric_archives_base_name
}

dependencies {
    implementation project(":core")
    include project(":core")

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"
}

processResources {
    inputs.property "version", rootProject.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

kotlin {
    jvmToolchain(25)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "boxloom-gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

tasks.named("runGameTest") {
    environment "BOXLOOM_BIND_HOST", "127.0.0.1"
    doFirst {
        // Keep the isolated test server away from a developer's running API.
        new java.net.ServerSocket(0, 0, java.net.InetAddress.getLoopbackAddress()).withCloseable { socket ->
            environment "BOXLOOM_PORT", socket.localPort.toString()
        }
    }
}

// Development-only code: the exporter is never included in the mod JAR.
sourceSets {
    registryGenerator {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

def registrySnapshot = rootProject.layout.projectDirectory.file("../data/minecraft/registries.json")

[exportRegistries: false, verifyRegistries: true].each { taskName, checkOnly ->
    tasks.register(taskName, JavaExec) {
        group = checkOnly ? "verification" : "generation"
        description = checkOnly
            ? "Verify the committed vanilla registry snapshot against Minecraft."
            : "Export vanilla block, entity, and item IDs from the configured Minecraft version."
        classpath = sourceSets.registryGenerator.runtimeClasspath
        mainClass = "dev.boxloom.fabric.RegistryExporter"
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }
        args registrySnapshot.asFile.absolutePath, project.minecraft_version
        if (checkOnly) {
            args "--check"
        }
        // Minecraft's logging output stays in the ignored build directory.
        workingDir = layout.buildDirectory.dir("registryGenerator").get().asFile
        doFirst {
            workingDir.mkdirs()
        }
    }
}

tasks.register("verifyNoClientCode") {
    group = "verification"
    description = "Fails if the Fabric server adapter references client-only Minecraft classes."

    doLast {
        def forbidden = "net.minecraft.client."
        def offenders = fileTree("src/main") {
            include "**/*.java", "**/*.kt"
        }.findAll { it.text.contains(forbidden) }

        if (!offenders.isEmpty()) {
            throw new GradleException("Common source references client-only classes: ${offenders}")
        }
    }
}

check.dependsOn tasks.named("verifyNoClientCode")
check.dependsOn tasks.named("verifyRegistries")
