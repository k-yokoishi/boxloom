plugins {
    id "net.fabricmc.fabric-loom"
    id "org.jetbrains.kotlin.jvm"
}

def bundledKtorModules = [
    "ktor-client-core",
    "ktor-events",
    "ktor-http",
    "ktor-http-cio",
    "ktor-io",
    "ktor-network",
    "ktor-serialization",
    "ktor-serialization-kotlinx",
    "ktor-serialization-kotlinx-json",
    "ktor-server-auth",
    "ktor-server-body-limit",
    "ktor-server-cio",
    "ktor-server-content-negotiation",
    "ktor-server-core",
    "ktor-server-host-common",
    "ktor-server-sessions",
    "ktor-server-sse",
    "ktor-server-status-pages",
    "ktor-sse",
    "ktor-utils",
    "ktor-websocket-serialization",
    "ktor-websockets",
]

configurations {
    distributionIncludes {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
        extendsFrom include
    }
    coreRuntimeAudit {
        canBeConsumed = false
        canBeResolved = true
        transitive = true
    }
}

base {
    archivesName = project.fabric_archives_base_name
}

dependencies {
    coreRuntimeAudit project(":core")
    implementation project(":core")
    include project(":core")

    bundledKtorModules.each { module ->
        implementation "io.ktor:${module}:${project.ktor_version}"
        include "io.ktor:${module}:${project.ktor_version}"
    }

    implementation "com.typesafe:config:1.4.9"
    include "com.typesafe:config:1.4.9"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j:1.11.0"
    include "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json-io:1.11.0"
    include "org.jetbrains.kotlinx:kotlinx-serialization-json-io:1.11.0"

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"
}

processResources {
    inputs.property "version", rootProject.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

kotlin {
    jvmToolchain(25)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register("verifyNoClientCode") {
    group = "verification"
    description = "Fails if the Fabric server adapter references client-only Minecraft classes."

    doLast {
        def forbidden = "net.minecraft.client."
        def offenders = fileTree("src/main") {
            include "**/*.java", "**/*.kt"
        }.findAll { it.text.contains(forbidden) }

        if (!offenders.isEmpty()) {
            throw new GradleException("Common source references client-only classes: ${offenders}")
        }
    }
}

tasks.register("verifyDistributionJar") {
    group = "verification"
    description = "Verifies the standalone Fabric distribution JAR and its nested runtime JARs."
    dependsOn tasks.named("jar")

    doLast {
        def distributionJar = tasks.named("jar").get().archiveFile.get().asFile
        def archive = new java.util.zip.ZipFile(distributionJar)

        try {
            def nestedEntries = archive.entries().findAll {
                !it.directory && it.name.startsWith("META-INF/jars/") && it.name.endsWith(".jar")
            }.toList()
            def nestedNames = nestedEntries.collect { it.name }.toSet()
            def descriptorEntry = archive.getEntry("fabric.mod.json")
            if (descriptorEntry == null) {
                throw new GradleException("Distribution JAR does not contain fabric.mod.json")
            }
            def descriptor = new groovy.json.JsonSlurper().parse(
                archive.getInputStream(descriptorEntry),
            )
            def declaredNames = descriptor.jars.collect { it.file as String }.toSet()
            if (declaredNames != nestedNames) {
                throw new GradleException(
                    "fabric.mod.json jars entries do not match META-INF/jars: " +
                        "declared=${declaredNames.sort()}, nested=${nestedNames.sort()}",
                )
            }

            def configuredNames = configurations.distributionIncludes.files.collect {
                "META-INF/jars/${it.name}"
            }.toSet()
            if (configuredNames != nestedNames) {
                throw new GradleException(
                    "Configured include dependencies do not match the distribution JAR: " +
                        "configured=${configuredNames.sort()}, nested=${nestedNames.sort()}",
                )
            }

            def forbiddenProvidedLibraries = [
                ~/kotlin-reflect-.*/,
                ~/kotlin-stdlib-.*/,
                ~/kotlinx-coroutines-core-.*/,
                ~/kotlinx-io-bytestring-.*/,
                ~/kotlinx-io-core-.*/,
                ~/kotlinx-serialization-core-.*/,
                ~/kotlinx-serialization-json-jvm-.*/,
                ~/slf4j-api-.*/,
            ]
            def duplicateProvided = nestedEntries.collect { it.name.tokenize('/').last() }.findAll {
                name -> forbiddenProvidedLibraries.any { pattern -> name ==~ pattern }
            }
            if (!duplicateProvided.isEmpty()) {
                throw new GradleException(
                    "Distribution duplicates libraries supplied by Fabric Language Kotlin or Minecraft: " +
                        duplicateProvided.sort(),
                )
            }

            def includedCoordinates = configurations.distributionIncludes.resolvedConfiguration.resolvedArtifacts.collect {
                "${it.moduleVersion.id.group}:${it.moduleVersion.id.name}".toString()
            }.toSet()
            def suppliedCoordinates = [
                "org.jetbrains:annotations",
                "org.slf4j:slf4j-api",
                "org.jetbrains.kotlin:kotlin-reflect",
                "org.jetbrains.kotlin:kotlin-stdlib",
                "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm",
                "org.jetbrains.kotlinx:kotlinx-io-bytestring-jvm",
                "org.jetbrains.kotlinx:kotlinx-io-core-jvm",
                "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm",
                "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm",
            ].toSet()
            def missingRuntime = configurations
                .coreRuntimeAudit
                .resolvedConfiguration
                .resolvedArtifacts
                .collect { "${it.moduleVersion.id.group}:${it.moduleVersion.id.name}".toString() }
                .findAll { it !in includedCoordinates && it !in suppliedCoordinates }
                .toSet()
            if (!missingRuntime.isEmpty()) {
                throw new GradleException(
                    "Distribution is missing transitive runtime dependencies: ${missingRuntime.sort()}",
                )
            }

            def classOwners = [:]
            def duplicateClasses = [:].withDefault { [] }
            def recordClass = { String path, String owner ->
                if (!path.endsWith(".class") || path.endsWith("module-info.class")) return
                def previous = classOwners.putIfAbsent(path, owner)
                if (previous != null && previous != owner) {
                    duplicateClasses[path].addAll([previous, owner])
                }
            }
            archive.entries().each { entry ->
                if (!entry.directory && !entry.name.startsWith("META-INF/jars/")) {
                    recordClass(entry.name, distributionJar.name)
                }
            }
            nestedEntries.each { nestedEntry ->
                def nestedArchive = new java.util.zip.ZipInputStream(
                    archive.getInputStream(nestedEntry),
                )
                try {
                    java.util.zip.ZipEntry entry
                    while ((entry = nestedArchive.nextEntry) != null) {
                        if (!entry.directory) recordClass(entry.name, nestedEntry.name)
                    }
                } finally {
                    nestedArchive.close()
                }
            }
            if (!duplicateClasses.isEmpty()) {
                def details = duplicateClasses.collect { path, owners ->
                    "$path in ${owners.toSet().sort()}"
                }.sort().join("\n")
                throw new GradleException("Duplicate classes found in distribution JAR:\n$details")
            }
        } finally {
            archive.close()
        }
    }
}

check.dependsOn tasks.named("verifyNoClientCode")
check.dependsOn tasks.named("verifyDistributionJar")
