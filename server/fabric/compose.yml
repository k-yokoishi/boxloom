services:
  minecraft:
    image: itzg/minecraft-server:2026.5.4-java25
    container_name: boxloom-fabric-poc
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"
      FABRIC_LOADER_VERSION: "0.19.5"
      MODS: |
        /mods/boxloom-0.1.0-alpha.3.jar
        https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.161.0%2B26.3/fabric-api-0.161.0%2B26.3.jar
        https://maven.fabricmc.net/net/fabricmc/fabric-language-kotlin/1.14.1%2Bkotlin.2.4.20/fabric-language-kotlin-1.14.1%2Bkotlin.2.4.20.jar
      ONLINE_MODE: "TRUE"
      ENFORCE_SECURE_PROFILE: "TRUE"
      MODE: "creative"
      DIFFICULTY: "peaceful"
      SPAWN_PROTECTION: "0"
      MEMORY: "2G"
      BOXLOOM_BIND_HOST: "0.0.0.0"
      BOXLOOM_PORT: "28886"
      BOXLOOM_AUTH_TOKEN: "boxloom-local-poc-token"
    ports:
      - "25566:25565"
      - "127.0.0.1:28886:28886"
    volumes:
      - boxloom-fabric-poc-data:/data
      - ./build/libs/boxloom-0.1.0-alpha.3.jar:/mods/boxloom-0.1.0-alpha.3.jar:ro
    stop_grace_period: 2m

volumes:
  boxloom-fabric-poc-data:
    name: boxloom-fabric-poc-data
