        '504':
          $ref: '#/components/responses/Timeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Entity:
      type: object
      description: A snapshot of a loaded, alive entity, captured on the server thread.
      required: [uuid, entity, dimension, x, y, z, yaw, pitch, name, health]
      properties:
        uuid:
          type: string
          format: uuid
        entity:
          type: string
          description: Resolved namespaced entity type ID.
          example: minecraft:zombie
        dimension:
          type: string
          description: Resolved namespaced dimension ID.
          example: minecraft:overworld
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        z:
          type: number
          format: double
        yaw:
          type: number
          description: Horizontal rotation in degrees.
        pitch:
          type: number
          description: Vertical rotation in degrees.
        name:
          type: string
          description: Plain-text entity name, including a custom name when present.
        health:
          type: [number, 'null']
          description: Current health points, or null for entities without health.
    WorldClockId:
      type: string
      minLength: 1
      default: minecraft:overworld
      description: World clock ID; an omitted namespace resolves to minecraft.
      example: minecraft:overworld
    SetTimeRequest:
      type: object
      required: [time]
      additionalProperties: false
      properties:
        clock:
          $ref: '#/components/schemas/WorldClockId'
        time:
          oneOf:
            - type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              description: Absolute total elapsed ticks.
            - type: string
              minLength: 1
              description: >-
                A time marker ID. Vanilla Overworld markers are day, noon, night,
                and midnight. An omitted namespace resolves to minecraft.
              example: day
    AddTimeRequest:
      type: object
      required: [ticks]
      additionalProperties: false
      properties:
        clock:
          $ref: '#/components/schemas/WorldClockId'
        ticks:
          type: integer
          format: int32
          minimum: -2147483648
          maximum: 2147483647
    TimeResult:
      type: object
      required: [clock, ticks]
      additionalProperties: false
      properties:
        clock:
          type: string
          description: Resolved namespaced world clock ID.
          example: minecraft:overworld
        ticks:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Total elapsed ticks, read immediately after the operation.
          example: 25000
    SayRequest:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 256
    SayResult:
      type: object
      additionalProperties: false
      required:
        - message
        - recipients
      properties:
        message:
          type: string
        recipients:
          type: integer
          minimum: 0
    TargetedBlock:
      type: object
      additionalProperties: false
      required: [dimension, x, y, z, block, face, distance, properties]
      properties:
        dimension:
          type: string
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
          description: Namespaced block ID captured before the action.
        face:
          type: string
          enum: [down, up, north, south, west, east]
        distance:
          type: number
          minimum: 0
          description: Distance in blocks from the eye to the hit surface.
        properties:
          $ref: '#/components/schemas/BlockProperties'
    TargetedBlockResponse:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          oneOf:
            - $ref: '#/components/schemas/TargetedBlock'
            - type: 'null'
    PlayerAttackResult:
      type: object
      additionalProperties: false
      required: [swung, target, broken]
      properties:
        swung:
          type: boolean
          description: Whether a new arm swing started; an existing swing may prevent another.
        target:
          oneOf:
            - $ref: '#/components/schemas/TargetedBlock'
            - type: 'null'
        broken:
          type: boolean
          description: Whether the targeted block's type changed during the native attack.
        entity:
          $ref: '#/components/schemas/Entity'
          description: Optional entity snapshot after an entity attack attempt; omitted for block attacks and misses.
    PlayerItemUseResult:
      type: object
      additionalProperties: false
      required: [active, item, remaining_ticks]
      properties:
        active:
          type: boolean
          description: Whether an API-owned native use is active at response time. Stop always returns false.
        item:
          description: Namespaced item ID while active; null when inactive.
          type: [string, 'null']
        remaining_ticks:
          type: integer
          minimum: 0
          description: Native use ticks remaining, clamped to zero. A response-time snapshot, not charge percentage. Zero when inactive.
    PlayerUseResult:
      type: object
      additionalProperties: false
      required: [used, swung, target, entity]
      properties:
        used:
          type: boolean
          description: Whether the native interaction consumed the action; not a guarantee of growth or item consumption.
        swung:
          type: boolean
          description: Whether a new interaction arm swing started; an existing swing may prevent another.
        target:
          description: Block snapshot before the attempt; null for entities and air. Present even when block interaction passes to in-air use.
          oneOf:
            - $ref: '#/components/schemas/TargetedBlock'
            - type: 'null'
        entity:
          description: Entity snapshot after the attempt, including a refused attempt; null for blocks and air.
          oneOf:
            - $ref: '#/components/schemas/Entity'
            - type: 'null'
    PlayerMiningResult:
      type: object
      additionalProperties: false
      required: [active, target, broken]
      properties:
        active:
          type: boolean
          description: Whether held mining is enabled, including while waiting with no target. Remains true after a break until stopped.
        target:
          description: Current block snapshot, or the block immediately broken by start; null while waiting without a target.
          oneOf:
            - $ref: '#/components/schemas/TargetedBlock'
            - type: 'null'
        broken:
          type: boolean
          description: True only if starting mining immediately broke the block; stop never breaks a block.
    Player:
      type: object
      additionalProperties: false
      required:
        - username
        - uuid
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
    PlayersResponse:
      type: object
      additionalProperties: false
      required:
        - players
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
    GiveItemRequest:
      type: object
      additionalProperties: false
      required: [item]
      properties:
        item:
          type: string
          description: Registered item ID. The minecraft namespace may be omitted. Air is not giveable.
          examples: ['minecraft:stone', 'minecraft:diamond_sword', 'bone_meal']
        count:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
          description: At most 100 times this item's maximum stack size, validated by the server.
    GivenItemSlot:
      type: object
      additionalProperties: false
      required: [slot, count]
      properties:
        slot:
          type: integer
          oneOf:
            - minimum: 0
              maximum: 35
            - const: 40
          description: Inventory index; 0-8 hotbar, 9-35 main inventory, 40 offhand.
        count:
          type: integer
          minimum: 1
          description: Number of items added to this slot by this request, not its resulting stack size.
    SelectSlotRequest:
      type: object
      additionalProperties: false
      required: [slot]
      properties:
        slot:
          type: integer
          minimum: 0
          maximum: 8
    SelectSlotResult:
      type: object
      additionalProperties: false
      required: [username, uuid, slot]
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
        slot:
          type: integer
          minimum: 0
          maximum: 8
    GiveItemResult:
      type: object
      additionalProperties: false
      required: [username, uuid, item, count, slot, slots]
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
        item:
          type: string
          description: Canonical namespaced item ID.
        count:
          type: integer
          minimum: 1
          description: Amount given; overflow follows vanilla rules and may not remain in inventory.
        slot:
          type: [integer, 'null']
          minimum: 0
          maximum: 8
          description: Lowest hotbar index that received items, or null if no hotbar slot received any.
        slots:
          type: array
          description: Destinations ordered by slot index; excludes dropped or discarded overflow. Counts sum to at most count.
          items:
            $ref: '#/components/schemas/GivenItemSlot'
    GameMode:
      type: string
      enum: [creative, survival]
    SetPlayerGameModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/GameMode'
    PlayerGameMode:
      type: object
      additionalProperties: false
      required: [username, uuid, mode]
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/GameMode'
    PlayerPosition:
      type: object
      additionalProperties: false
      required:
        - username
        - uuid
        - dimension
        - x
        - y
        - z
        - yaw
        - pitch
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x:
          type: number
        y:
          type: number
        z:
          type: number
        yaw:
          type: number
        pitch:
          type: number
    TeleportPlayerRequest:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: number
          description: Absolute destination X coordinate
        y:
          type: number
          description: Absolute destination Y coordinate
        z:
          type: number
          description: Absolute destination Z coordinate
        dimension:
          type: string
          description: Loaded destination dimension; omitted to keep the current dimension
          examples:
            - minecraft:overworld
        yaw:
          type: number
          description: Horizontal rotation in degrees; omitted to keep the current yaw
        pitch:
          type: number
          description: Vertical rotation in degrees; omitted to keep the current pitch
    BlockProperties:
      type: object
      description: Canonical block-state property names and string values. Empty for blocks without state properties.
      propertyNames:
        type: string
        minLength: 1
      additionalProperties:
        type: string
        minLength: 1
      example: {age: '3'}
    SetBlockRequest:
      type: object
      description: Start from the block default state and apply optional properties; omitted properties reset to defaults. All values must be strings. Unknown properties or invalid values return 400 INVALID_BLOCK_PROPERTY before any world change.
      additionalProperties: false
      required:
        - dimension
        - x
        - y
        - z
        - block
      properties:
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
          examples:
            - minecraft:diamond_block
        properties:
          $ref: '#/components/schemas/BlockProperties'
    GetBlockResult:
      type: object
      additionalProperties: false
      required:
        - dimension
        - x
        - y
        - z
        - block
        - properties
      properties:
        dimension:
          type: string
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
        properties:
          $ref: '#/components/schemas/BlockProperties'
    SetBlockResult:
      type: object
      description: Actual block and complete state at the position after the attempt, including a no-op or a position outside build height. Properties-only changes count as changed.
      additionalProperties: false
      required:
        - changed
        - dimension
        - x
        - y
        - z
        - block
        - properties
      properties:
        changed:
          type: boolean
        dimension:
          type: string
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
        properties:
          $ref: '#/components/schemas/BlockProperties'
    FillMode:
      type: string
      enum: [replace, destroy, keep, outline, hollow, strict]
      default: replace
      description: >-
        replace sets matching positions without breaking blocks. destroy first
        breaks matching blocks using native drops. keep sets only air and cannot
        be combined with replace. outline sets only the cuboid boundary. hollow
        sets the boundary and clears matching interior positions to air. strict
        skips placement side effects, shape updates, and neighbor notifications.
    FillRequest:
      type: object
      description: >-
        The two corners are inclusive and may be supplied in either order. The
        resulting cuboid must contain at most 32,768 blocks, before filtering.
        Destination and filter IDs and properties are validated before any world
        change. The optional replace filter matches an exact block ID, not a tag,
        and only the properties supplied in replaceProperties. Omitted destination
        properties use the block defaults. A no-op succeeds with changedBlocks 0.
      additionalProperties: false
      dependentRequired:
        replaceProperties: [replace]
      allOf:
        - if:
            required: [mode]
            properties:
              mode:
                const: keep
          then:
            not:
              required: [replace]
      required:
        - dimension
        - x1
        - y1
        - z1
        - x2
        - y2
        - z2
        - block
      properties:
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x1:
          type: integer
          format: int32
        y1:
          type: integer
          format: int32
        z1:
          type: integer
          format: int32
        x2:
          type: integer
          format: int32
        y2:
          type: integer
          format: int32
        z2:
          type: integer
          format: int32
        block:
          type: string
          examples:
            - minecraft:stone
        mode:
          $ref: '#/components/schemas/FillMode'
        replace:
          type: string
          minLength: 1
          description: Only affect positions containing this registered block ID.
          examples:
            - minecraft:dirt
        properties:
          $ref: '#/components/schemas/BlockProperties'
          description: Destination block-state properties, starting from defaults.
        replaceProperties:
          $ref: '#/components/schemas/BlockProperties'
          description: Partial state filter. Requires replace; unspecified properties match any value.
    FillResult:
      type: object
      additionalProperties: false
      required:
        - changedBlocks
        - dimension
        - x1
        - y1
        - z1
        - x2
        - y2
        - z2
        - block
      properties:
        changedBlocks:
          type: integer
          format: int32
          minimum: 0
          maximum: 32768
          description: >-
            Positions successfully placed or destroyed, counted once per position.
            Destroying a block counts even if placing air is then a no-op or the
            same block type is recreated. Not a drop or final-state difference count.
        dimension:
          type: string
        x1:
          type: integer
          format: int32
        y1:
          type: integer
          format: int32
        z1:
          type: integer
          format: int32
        x2:
          type: integer
          format: int32
        y2:
          type: integer
          format: int32
        z2:
          type: integer
          format: int32
        block:
          type: string
    SummonRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
        - entity
        - x
        - y
        - z
      properties:
        dimension:
          type: string
          examples:
            - minecraft:overworld
        entity:
          type: string
          examples:
            - minecraft:arrow
        x:
          type: number
        y:
          type: number
        z:
          type: number
        nbt:
          $ref: '#/components/schemas/NbtCompound'
    SummonResult:
      type: object
      additionalProperties: false
      required:
        - uuid
        - entity
        - dimension
        - x
        - y
        - z
      properties:
        uuid:
          type: string
          format: uuid
        entity:
          type: string
        dimension:
          type: string
        x:
          type: number
        y:
          type: number
        z:
          type: number
    KillEntityRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
      properties:
        dimension:
          type: string
          minLength: 1
          examples:
            - minecraft:overworld
    KillEntitiesRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
        - entity
      dependentRequired:
        x: [y, z, radius]
        y: [x, z, radius]
        z: [x, y, radius]
        radius: [x, y, z]
      properties:
        dimension:
          type: string
          minLength: 1
          examples:
            - minecraft:overworld
        entity:
          type: string
          minLength: 1
          description: Exact registered entity type ID
          examples:
            - minecraft:zombie
        x:
          type: number
          description: Finite absolute center X coordinate
        y:
          type: number
          description: Finite absolute center Y coordinate
        z:
          type: number
          description: Finite absolute center Z coordinate
        radius:
          type: number
          minimum: 0
          description: Finite non-negative radius; the boundary is included
    KillResult:
      type: object
      additionalProperties: false
      required:
        - dimension
        - killedEntities
      properties:
        dimension:
          type: string
        killedEntities:
          type: integer
          format: int32
          minimum: 0
    NbtCompound:
      type: object
      description: >-
        A plain JSON object converted recursively to an NBT compound. JSON integers
        become IntTag or LongTag, floating-point values become DoubleTag, booleans
        become ByteTag, and null is not supported.
      additionalProperties:
        $ref: '#/components/schemas/NbtValue'
    NbtValue:
      anyOf:
        - $ref: '#/components/schemas/NbtCompound'
        - type: array
          items:
            $ref: '#/components/schemas/NbtValue'
        - type: string
        - type: boolean
        - type: integer
          format: int64
        - type: number
          format: double
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    TimeResult:
      description: The world clock's current total elapsed ticks
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TimeResult'
    TimeNotFound:
      description: >-
        CLOCK_NOT_FOUND if the clock does not exist, TIME_MARKER_NOT_FOUND if a
        set request names a marker absent from that clock, or ROUTE_NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: A Bearer token is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The Bearer token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: The route does not accept the request method
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: The server could not complete the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorldNotLoaded:
      description: No Minecraft world is currently loaded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Timeout:
      description: The Minecraft server thread did not respond before the deadline
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
