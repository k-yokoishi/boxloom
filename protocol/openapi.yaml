openapi: 3.1.0
info:
  title: boxloom internal API
  version: 0.1.0
  description: >-
    The versioned, private API shared by the boxloom Fabric mod and language SDKs.
    Bearer authentication is optional on loopback and required for a non-loopback
    listener. The API is intended for loopback or a trusted private network.
servers:
  - url: http://127.0.0.1:28886
security:
  - bearerAuth: []
  - {}
paths:
  /v1/events:
    get:
      operationId: watchEvents
      summary: Stream player events
      description: >-
        Opens a Server-Sent Events stream. With no Last-Event-ID, the stream starts
        at the current live position. Reconnecting with the last received event ID
        replays retained events after that cursor. Event IDs are opaque and valid
        only while the corresponding server session and retained history remain
        available. Chat, death, and player action events share one cursor sequence and a
        combined retention limit of 1,024 events. The stream sends retry fields
        and comment heartbeats. All event types are sent on this endpoint;
        consumers distinguish them by their matching SSE event name and JSON type.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Opaque ID of the last event completely processed by the caller
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: >-
            A live SSE stream containing stream.ready, chat.message, player.death,
            player.swing, block.attack, block.use, item.use, stream.reset, and error events
          headers:
            Cache-Control:
              description: Prevents intermediaries from caching or transforming the stream
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                chatMessage:
                  summary: One player chat event
                  value: |-
                    retry: 1000

                    event: chat.message
                    id: 2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:42
                    data: {"type":"chat.message","id":"2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:42","timestamp":"2026-08-14T00:00:00Z","message":"hello","player":{"username":"Steve","uuid":"58f6e634-15d9-4d4c-8ca0-8a4b23fe38af"}}
                playerDeath:
                  summary: Player death with a snapshot of the death location
                  value: |-
                    event: player.death
                    id: 2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:43
                    data: {"type":"player.death","id":"2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:43","timestamp":"2026-08-14T00:00:01Z","message":"Steve fell from a high place","player":{"username":"Steve","uuid":"58f6e634-15d9-4d4c-8ca0-8a4b23fe38af"},"dimension":"minecraft:overworld","x":1.5,"y":64.0,"z":-2.25}
                playerSwing:
                  summary: An attack swing, including attacks that miss
                  value: |-
                    event: player.swing
                    id: 2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:44
                    data: {"type":"player.swing","id":"2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:44","timestamp":"2026-11-06T00:00:00Z","player":{"username":"Steve","uuid":"58f6e634-15d9-4d4c-8ca0-8a4b23fe38af"},"dimension":"minecraft:overworld","x":1.5,"y":64.0,"z":-2.25,"hand":"main_hand","item":"minecraft:diamond_sword"}
                blockUse:
                  summary: A block-use attempt with an empty off hand
                  value: |-
                    event: block.use
                    id: 2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:45
                    data: {"type":"block.use","id":"2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:45","timestamp":"2026-11-06T00:00:01Z","player":{"username":"Steve","uuid":"58f6e634-15d9-4d4c-8ca0-8a4b23fe38af"},"dimension":"minecraft:overworld","x":1.5,"y":64.0,"z":-2.25,"hand":"off_hand","item":null,"block":"minecraft:stone","block_x":-2,"block_y":63,"block_z":4,"face":"up"}
        '400':
          description: Last-Event-ID is malformed or ahead of the live stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          description: The Accept header does not allow text/event-stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: >-
            Last-Event-ID belongs to another server session or its following events
            are no longer retained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/chat/messages:
    post:
      operationId: say
      summary: Broadcast a system message to connected players
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SayRequest'
      responses:
        '200':
          description: The message broadcast result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SayResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players:
    get:
      operationId: getPlayers
      summary: List players currently connected to the server
      responses:
        '200':
          description: The connected players in server list order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/position:
    get:
      operationId: getPlayerPosition
      summary: Read a connected player's position and look direction
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      responses:
        '200':
          description: The player position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPosition'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/teleport:
    post:
      operationId: teleportPlayer
      summary: Teleport a connected player to absolute coordinates
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeleportPlayerRequest'
      responses:
        '200':
          description: The player's position after teleporting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPosition'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected, the dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Minecraft could not teleport the player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/blocks:
    get:
      operationId: getBlock
      summary: Get one block from a loaded dimension
      parameters:
        - name: dimension
          in: query
          required: true
          schema:
            type: string
          example: minecraft:overworld
        - name: x
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: y
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: z
          in: query
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The block at the requested position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBlockResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: setBlock
      summary: Set one block in a loaded dimension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBlockRequest'
      responses:
        '200':
          description: The result of setting the block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetBlockResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/blocks/fill:
    post:
      operationId: fill
      summary: Fill an inclusive block region in a loaded dimension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillRequest'
      responses:
        '200':
          description: The result of filling the region
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/entities:
    get:
      operationId: getEntities
      summary: List loaded, alive entities in a dimension
      description: >-
        Returns a snapshot on the server thread, including players and dropped
        items. No chunks are loaded. Filter by exact registered entity type and
        an optional inclusive sphere, then sort, then apply limit. Omit entity
        to select every type. Supply x, y, and z together; they are required when
        radius is supplied or sort is nearest or furthest. Coordinates alone
        are allowed. Distances are three-dimensional and measured from each
        entity's position. A zero radius selects the exact center. Arbitrary
        order is unspecified; distance ties are ordered by UUID ascending.
        Unknown or repeated query parameters are rejected. No matches returns
        an empty entities array. Health is null for entities without health.
      parameters:
        - name: dimension
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: ID of a loaded dimension.
          example: minecraft:overworld
        - name: entity
          in: query
          schema:
            type: string
            minLength: 1
          description: Exact registered entity type ID. Omit for all types.
          example: minecraft:zombie
        - name: x
          in: query
          schema:
            type: number
            format: double
          description: Finite absolute center x coordinate; supply x, y, and z together.
        - name: y
          in: query
          schema:
            type: number
            format: double
          description: Finite absolute center y coordinate; supply x, y, and z together.
        - name: z
          in: query
          schema:
            type: number
            format: double
          description: Finite absolute center z coordinate; supply x, y, and z together.
        - name: radius
          in: query
          schema:
            type: number
            format: double
            minimum: 0
          description: Finite inclusive radius in blocks; requires x, y, and z.
        - name: sort
          in: query
          schema:
            type: string
            enum: [arbitrary, nearest, furthest]
            default: arbitrary
          description: Distance sorting requires x, y, and z, with or without radius.
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
          description: Maximum number returned after filtering and sorting. Omit for no limit.
      responses:
        '200':
          description: A snapshot of the selected entities
          content:
            application/json:
              schema:
                type: object
                required: [entities]
                properties:
                  entities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entity'
        '400':
          description: Invalid query, malformed dimension ID, or malformed or unregistered entity type ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: summon
      summary: Summon one entity in a loaded dimension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummonRequest'
      responses:
        '200':
          description: The summoned entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummonResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An entity with the supplied NBT UUID already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/entities/{uuid}/kill:
    post:
      operationId: killEntity
      summary: Kill one loaded entity by UUID
      description: >-
        Performs Minecraft's kill operation in the specified dimension, including
        normal death processing. An absent, unloaded, or already dead entity
        returns killedEntities equal to zero. No chunks are loaded for this request.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillEntityRequest'
      responses:
        '200':
          description: The number of entities killed (zero or one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/entities/kill:
    post:
      operationId: killEntities
      summary: Kill loaded entities by exact type, optionally within a sphere
      description: >-
        The entity field is an exact registered entity type ID. Supply x, y, z,
        and radius together for an inclusive sphere measured from each entity's
        position in absolute coordinates. Omit all four to select all loaded
        entities of that type in the specified dimension. No chunks are loaded.
        Only entities selected before killing starts are processed; new drops or
        smaller mobs spawned by death processing are not added to the selection.
        An empty selection returns killedEntities equal to zero.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillEntitiesRequest'
      responses:
        '200':
          description: The number of entities killed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/time:
    get:
      operationId: getTime
      summary: Read a world clock's total elapsed ticks
      parameters:
        - name: clock
          in: query
          schema:
            $ref: '#/components/schemas/WorldClockId'
      responses:
        '200':
          $ref: '#/components/responses/TimeResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TimeNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: setTime
      summary: Set total ticks or advance a world clock to a time marker
      description: >-
        An integer sets the clock's total elapsed ticks. A time marker such as
        day, noon, night, or midnight advances to its next occurrence, as in
        Minecraft 26.3's /time set command. Custom time marker IDs are supported.
        Clock time is shared across dimensions using that clock. Game time and
        the clock's paused state and rate are unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTimeRequest'
            example:
              time: day
      responses:
        '200':
          $ref: '#/components/responses/TimeResult'
        '409':
          description: TIME_ALREADY_AT_MARKER if the clock is already at the requested marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TimeNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/time/add:
    post:
      operationId: addTime
      summary: Add signed ticks to a world clock
      description: >-
        Adds a signed 32-bit tick count, matching Minecraft 26.3's /time add
        command. Negative values rewind the clock; the result is clamped at zero.
        Game time and the clock's paused state and rate are unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTimeRequest'
            example:
              ticks: 6000
      responses:
        '200':
          $ref: '#/components/responses/TimeResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TimeNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Entity:
      type: object
      description: A snapshot of a loaded, alive entity, captured on the server thread.
      required: [uuid, entity, dimension, x, y, z, yaw, pitch, name, health]
      properties:
        uuid:
          type: string
          format: uuid
        entity:
          type: string
          description: Resolved namespaced entity type ID.
          example: minecraft:zombie
        dimension:
          type: string
          description: Resolved namespaced dimension ID.
          example: minecraft:overworld
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        z:
          type: number
          format: double
        yaw:
          type: number
          description: Horizontal rotation in degrees.
        pitch:
          type: number
          description: Vertical rotation in degrees.
        name:
          type: string
          description: Plain-text entity name, including a custom name when present.
        health:
          type: [number, 'null']
          description: Current health points, or null for entities without health.
    WorldClockId:
      type: string
      minLength: 1
      default: minecraft:overworld
      description: World clock ID; an omitted namespace resolves to minecraft.
      example: minecraft:overworld
    SetTimeRequest:
      type: object
      required: [time]
      additionalProperties: false
      properties:
        clock:
          $ref: '#/components/schemas/WorldClockId'
        time:
          oneOf:
            - type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              description: Absolute total elapsed ticks.
            - type: string
              minLength: 1
              description: >-
                A time marker ID. Vanilla Overworld markers are day, noon, night,
                and midnight. An omitted namespace resolves to minecraft.
              example: day
    AddTimeRequest:
      type: object
      required: [ticks]
      additionalProperties: false
      properties:
        clock:
          $ref: '#/components/schemas/WorldClockId'
        ticks:
          type: integer
          format: int32
          minimum: -2147483648
          maximum: 2147483647
    TimeResult:
      type: object
      required: [clock, ticks]
      additionalProperties: false
      properties:
        clock:
          type: string
          description: Resolved namespaced world clock ID.
          example: minecraft:overworld
        ticks:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Total elapsed ticks, read immediately after the operation.
          example: 25000
    SayRequest:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 256
    SayResult:
      type: object
      additionalProperties: false
      required:
        - message
        - recipients
      properties:
        message:
          type: string
        recipients:
          type: integer
          minimum: 0
    Player:
      type: object
      additionalProperties: false
      required:
        - username
        - uuid
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
    PlayersResponse:
      type: object
      additionalProperties: false
      required:
        - players
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
    PlayerPosition:
      type: object
      additionalProperties: false
      required:
        - username
        - uuid
        - dimension
        - x
        - y
        - z
        - yaw
        - pitch
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x:
          type: number
        y:
          type: number
        z:
          type: number
        yaw:
          type: number
        pitch:
          type: number
    TeleportPlayerRequest:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: number
          description: Absolute destination X coordinate
        y:
          type: number
          description: Absolute destination Y coordinate
        z:
          type: number
          description: Absolute destination Z coordinate
        dimension:
          type: string
          description: Loaded destination dimension; omitted to keep the current dimension
          examples:
            - minecraft:overworld
        yaw:
          type: number
          description: Horizontal rotation in degrees; omitted to keep the current yaw
        pitch:
          type: number
          description: Vertical rotation in degrees; omitted to keep the current pitch
    SetBlockRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
        - x
        - y
        - z
        - block
      properties:
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
          examples:
            - minecraft:diamond_block
    GetBlockResult:
      type: object
      additionalProperties: false
      required:
        - dimension
        - x
        - y
        - z
        - block
      properties:
        dimension:
          type: string
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
    SetBlockResult:
      type: object
      additionalProperties: false
      required:
        - changed
        - dimension
        - x
        - y
        - z
        - block
      properties:
        changed:
          type: boolean
        dimension:
          type: string
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
    FillRequest:
      type: object
      description: >-
        The two corners are inclusive and may be supplied in either order. The
        resulting cuboid must contain at most 32,768 blocks.
      additionalProperties: false
      required:
        - dimension
        - x1
        - y1
        - z1
        - x2
        - y2
        - z2
        - block
      properties:
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x1:
          type: integer
          format: int32
        y1:
          type: integer
          format: int32
        z1:
          type: integer
          format: int32
        x2:
          type: integer
          format: int32
        y2:
          type: integer
          format: int32
        z2:
          type: integer
          format: int32
        block:
          type: string
          examples:
            - minecraft:stone
    FillResult:
      type: object
      additionalProperties: false
      required:
        - changedBlocks
        - dimension
        - x1
        - y1
        - z1
        - x2
        - y2
        - z2
        - block
      properties:
        changedBlocks:
          type: integer
          format: int32
          minimum: 0
          maximum: 32768
        dimension:
          type: string
        x1:
          type: integer
          format: int32
        y1:
          type: integer
          format: int32
        z1:
          type: integer
          format: int32
        x2:
          type: integer
          format: int32
        y2:
          type: integer
          format: int32
        z2:
          type: integer
          format: int32
        block:
          type: string
    SummonRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
        - entity
        - x
        - y
        - z
      properties:
        dimension:
          type: string
          examples:
            - minecraft:overworld
        entity:
          type: string
          examples:
            - minecraft:arrow
        x:
          type: number
        y:
          type: number
        z:
          type: number
        nbt:
          $ref: '#/components/schemas/NbtCompound'
    SummonResult:
      type: object
      additionalProperties: false
      required:
        - uuid
        - entity
        - dimension
        - x
        - y
        - z
      properties:
        uuid:
          type: string
          format: uuid
        entity:
          type: string
        dimension:
          type: string
        x:
          type: number
        y:
          type: number
        z:
          type: number
    KillEntityRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
      properties:
        dimension:
          type: string
          minLength: 1
          examples:
            - minecraft:overworld
    KillEntitiesRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
        - entity
      dependentRequired:
        x: [y, z, radius]
        y: [x, z, radius]
        z: [x, y, radius]
        radius: [x, y, z]
      properties:
        dimension:
          type: string
          minLength: 1
          examples:
            - minecraft:overworld
        entity:
          type: string
          minLength: 1
          description: Exact registered entity type ID
          examples:
            - minecraft:zombie
        x:
          type: number
          description: Finite absolute center X coordinate
        y:
          type: number
          description: Finite absolute center Y coordinate
        z:
          type: number
          description: Finite absolute center Z coordinate
        radius:
          type: number
          minimum: 0
          description: Finite non-negative radius; the boundary is included
    KillResult:
      type: object
      additionalProperties: false
      required:
        - dimension
        - killedEntities
      properties:
        dimension:
          type: string
        killedEntities:
          type: integer
          format: int32
          minimum: 0
    NbtCompound:
      type: object
      description: >-
        A plain JSON object converted recursively to an NBT compound. JSON integers
        become IntTag or LongTag, floating-point values become DoubleTag, booleans
        become ByteTag, and null is not supported.
      additionalProperties:
        $ref: '#/components/schemas/NbtValue'
    NbtValue:
      anyOf:
        - $ref: '#/components/schemas/NbtCompound'
        - type: array
          items:
            $ref: '#/components/schemas/NbtValue'
        - type: string
        - type: boolean
        - type: integer
          format: int64
        - type: number
          format: double
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    TimeResult:
      description: The world clock's current total elapsed ticks
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TimeResult'
    TimeNotFound:
      description: >-
        CLOCK_NOT_FOUND if the clock does not exist, TIME_MARKER_NOT_FOUND if a
        set request names a marker absent from that clock, or ROUTE_NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: A Bearer token is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The Bearer token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: The route does not accept the request method
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: The server could not complete the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorldNotLoaded:
      description: No Minecraft world is currently loaded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Timeout:
      description: The Minecraft server thread did not respond before the deadline
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
