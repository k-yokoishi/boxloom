openapi: 3.1.0
info:
  title: boxloom internal API
  version: 0.1.0
  description: >-
    The versioned, private API shared by the boxloom Fabric mod and language SDKs.
    Bearer authentication is optional on loopback and required for a non-loopback
    listener. The API is intended for loopback or a trusted private network.
servers:
  - url: http://127.0.0.1:28886
security:
  - bearerAuth: []
  - {}
paths:
  /v1/events:
    get:
      operationId: watchEvents
      summary: Stream player chat messages
      description: >-
        Opens a Server-Sent Events stream. With no Last-Event-ID, the stream starts
        at the current live position. Reconnecting with the last received event ID
        replays retained events after that cursor. Event IDs are opaque and valid
        only while the corresponding server session and retained history remain
        available. The stream sends retry fields and comment heartbeats.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Opaque ID of the last event completely processed by the caller
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: >-
            A live SSE stream containing stream.ready, chat.message, stream.reset,
            and error events
          headers:
            Cache-Control:
              description: Prevents intermediaries from caching or transforming the stream
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                chatMessage:
                  summary: One player chat event
                  value: |-
                    retry: 1000

                    event: chat.message
                    id: 2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:42
                    data: {"type":"chat.message","id":"2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:42","timestamp":"2026-08-14T00:00:00Z","message":"hello","player":{"username":"Steve","uuid":"58f6e634-15d9-4d4c-8ca0-8a4b23fe38af"}}
        '400':
          description: Last-Event-ID is malformed or ahead of the live stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          description: The Accept header does not allow text/event-stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: >-
            Last-Event-ID belongs to another server session or its following events
            are no longer retained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/chat/messages:
    post:
      operationId: say
      summary: Broadcast a system message to connected players
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SayRequest'
      responses:
        '200':
          description: The message broadcast result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SayResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players:
    get:
      operationId: getPlayers
      summary: List players currently connected to the server
      responses:
        '200':
          description: The connected players in server list order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/position:
    get:
      operationId: getPlayerPosition
      summary: Read a connected player's position and look direction
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      responses:
        '200':
          description: The player position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPosition'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/teleport:
    post:
      operationId: teleportPlayer
      summary: Teleport a connected player to absolute coordinates
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeleportPlayerRequest'
      responses:
        '200':
          description: The player's position after teleporting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPosition'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected, the dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Minecraft could not teleport the player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/blocks:
    post:
      operationId: setBlock
      summary: Set one block in a loaded dimension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBlockRequest'
      responses:
        '200':
          description: The result of setting the block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetBlockResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/entities:
    post:
      operationId: summon
      summary: Summon one entity in a loaded dimension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummonRequest'
      responses:
        '200':
          description: The summoned entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummonResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An entity with the supplied NBT UUID already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SayRequest:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 256
    SayResult:
      type: object
      additionalProperties: false
      required:
        - message
        - recipients
      properties:
        message:
          type: string
        recipients:
          type: integer
          minimum: 0
    Player:
      type: object
      additionalProperties: false
      required:
        - username
        - uuid
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
    PlayersResponse:
      type: object
      additionalProperties: false
      required:
        - players
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
    PlayerPosition:
      type: object
      additionalProperties: false
      required:
        - username
        - uuid
        - dimension
        - x
        - y
        - z
        - yaw
        - pitch
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x:
          type: number
        y:
          type: number
        z:
          type: number
        yaw:
          type: number
        pitch:
          type: number
    TeleportPlayerRequest:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: number
          description: Absolute destination X coordinate
        y:
          type: number
          description: Absolute destination Y coordinate
        z:
          type: number
          description: Absolute destination Z coordinate
        dimension:
          type: string
          description: Loaded destination dimension; omitted to keep the current dimension
          examples:
            - minecraft:overworld
        yaw:
          type: number
          description: Horizontal rotation in degrees; omitted to keep the current yaw
        pitch:
          type: number
          description: Vertical rotation in degrees; omitted to keep the current pitch
    SetBlockRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
        - x
        - y
        - z
        - block
      properties:
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
          examples:
            - minecraft:diamond_block
    SetBlockResult:
      type: object
      additionalProperties: false
      required:
        - changed
        - dimension
        - x
        - y
        - z
        - block
      properties:
        changed:
          type: boolean
        dimension:
          type: string
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
    SummonRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
        - entity
        - x
        - y
        - z
      properties:
        dimension:
          type: string
          examples:
            - minecraft:overworld
        entity:
          type: string
          examples:
            - minecraft:arrow
        x:
          type: number
        y:
          type: number
        z:
          type: number
        nbt:
          $ref: '#/components/schemas/NbtCompound'
    SummonResult:
      type: object
      additionalProperties: false
      required:
        - uuid
        - entity
        - dimension
        - x
        - y
        - z
      properties:
        uuid:
          type: string
          format: uuid
        entity:
          type: string
        dimension:
          type: string
        x:
          type: number
        y:
          type: number
        z:
          type: number
    NbtCompound:
      type: object
      description: >-
        A plain JSON object converted recursively to an NBT compound. JSON integers
        become IntTag or LongTag, floating-point values become DoubleTag, booleans
        become ByteTag, and null is not supported.
      additionalProperties:
        $ref: '#/components/schemas/NbtValue'
    NbtValue:
      anyOf:
        - $ref: '#/components/schemas/NbtCompound'
        - type: array
          items:
            $ref: '#/components/schemas/NbtValue'
        - type: string
        - type: boolean
        - type: integer
          format: int64
        - type: number
          format: double
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    InvalidRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: A Bearer token is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The Bearer token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: The route does not accept the request method
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: The server could not complete the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorldNotLoaded:
      description: No Minecraft world is currently loaded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Timeout:
      description: The Minecraft server thread did not respond before the deadline
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
