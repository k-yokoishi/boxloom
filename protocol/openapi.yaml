  /v1/players/{username}/give:
    post:
      operationId: giveItem
      summary: Give a connected player an item using vanilla give rules
      description: >-
        Resolves an item ID (including blocks with an item form) and gives it on
        the server thread. The minecraft namespace may be omitted. Automatically
        merges matching stacks and uses free inventory slots without replacing
        other items or selecting a hotbar slot. Stack sizes and the limit of
        100 stacks per request match vanilla /give. Survival overflow drops at
        the player with immediate pickup reserved for that player; creative
        overflow follows vanilla and may be discarded. Count reports the amount
        given, not the amount retained in inventory. Slots reports each destination
        and its added count, ordered by inventory index (0-8 hotbar, 9-35 main
        inventory, 40 offhand). Slot is the lowest hotbar index that received
        items, or null if none did. Dropped or discarded items have no slot.
        These are response-time snapshots; later player actions may move items.
        Accepts registered item IDs
        only, without command selectors, components, or NBT. No query parameters.
        Player operator permissions are not required. Requests are not idempotent.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiveItemRequest'
      responses:
        '200':
          description: The player, canonical item ID, requested count, and inventory destinations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiveItemResult'
        '400':
          description: >-
            INVALID_REQUEST for malformed fields, INVALID_ITEM for an unknown,
            disabled, air, or malformed item ID, or INVALID_COUNT for a count
            exceeding 100 stacks of this item. Validation precedes inventory changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected (PLAYER_NOT_CONNECTED), or the route does not exist
          content:
