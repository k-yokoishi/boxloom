  /v1/players/{username}/select-slot:
    post:
      operationId: selectSlot
      summary: Select a connected player's hotbar slot
      description: >-
        Selects a hotbar slot on the server thread and sends the selection to
        the player's client. Slots are numbered 0-8, left to right (keyboard
        keys 1-9). Does not move items from the main inventory or offhand.
        Empty slots may be selected. Changing slots cancels API mining and
        main-hand item use without release effects (a bow does not fire).
        Selecting the current slot preserves ongoing actions. No query parameters.
        Player operator permissions are not required.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectSlotRequest'
      responses:
        '200':
          description: The player and selected hotbar slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectSlotResult'
        '400':
          description: INVALID_REQUEST for malformed fields or a slot outside 0-8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected (PLAYER_NOT_CONNECTED), or the route does not exist
