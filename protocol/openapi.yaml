openapi: 3.1.0
info:
  title: boxloom internal API
  version: 0.1.0
  description: >-
    The versioned, private API shared by the boxloom Fabric mod and language SDKs.
    Bearer authentication is optional on loopback and required for a non-loopback
    listener. The API is intended for loopback or a trusted private network.
servers:
  - url: http://127.0.0.1:28886
security:
  - bearerAuth: []
  - {}
paths:
  /v1/chat/messages:
    post:
      operationId: say
      summary: Broadcast a system message to connected players
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SayRequest'
      responses:
        '200':
          description: The message broadcast result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SayResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players:
    get:
      operationId: getPlayers
      summary: List players currently connected to the server
      responses:
        '200':
          description: The connected players in server list order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/position:
    get:
      operationId: getPlayerPosition
      summary: Read a connected player's position and look direction
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      responses:
        '200':
          description: The player position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPosition'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/blocks:
    post:
      operationId: setBlock
      summary: Set one block in a loaded dimension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBlockRequest'
      responses:
        '200':
          description: The result of setting the block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetBlockResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SayRequest:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 256
    SayResult:
      type: object
      additionalProperties: false
      required:
        - message
        - recipients
      properties:
        message:
          type: string
        recipients:
          type: integer
          minimum: 0
    Player:
      type: object
      additionalProperties: false
      required:
        - username
        - uuid
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
    PlayersResponse:
      type: object
      additionalProperties: false
      required:
        - players
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
    PlayerPosition:
      type: object
      additionalProperties: false
      required:
        - username
        - uuid
        - dimension
        - x
        - y
        - z
        - yaw
        - pitch
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x:
          type: number
        y:
          type: number
        z:
          type: number
        yaw:
          type: number
        pitch:
          type: number
    SetBlockRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
        - x
        - y
        - z
        - block
      properties:
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
          examples:
            - minecraft:diamond_block
    SetBlockResult:
      type: object
      additionalProperties: false
      required:
        - changed
        - dimension
        - x
        - y
        - z
        - block
      properties:
        changed:
          type: boolean
        dimension:
          type: string
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    InvalidRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: A Bearer token is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The Bearer token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: The route does not accept the request method
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: The server could not complete the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorldNotLoaded:
      description: No Minecraft world is currently loaded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Timeout:
      description: The Minecraft server thread did not respond before the deadline
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
