        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/blocks/fill:
    post:
      operationId: fill
      summary: Fill an inclusive block region in a loaded dimension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillRequest'
      responses:
        '200':
          description: The result of filling the region
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/entities:
    get:
      operationId: getEntities
      summary: List loaded, alive entities in a dimension
      description: >-
        Returns a snapshot on the server thread, including players and dropped
        items. No chunks are loaded. Filter by exact registered entity type and
        an optional inclusive sphere, then sort, then apply limit. Omit entity
        to select every type. Supply x, y, and z together; they are required when
        radius is supplied or sort is nearest or furthest. Coordinates alone
        are allowed. Distances are three-dimensional and measured from each
        entity's position. A zero radius selects the exact center. Arbitrary
        order is unspecified; distance ties are ordered by UUID ascending.
        Unknown or repeated query parameters are rejected. No matches returns
        an empty entities array. Health is null for entities without health.
      parameters:
        - name: dimension
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: ID of a loaded dimension.
          example: minecraft:overworld
        - name: entity
          in: query
          schema:
            type: string
            minLength: 1
          description: Exact registered entity type ID. Omit for all types.
          example: minecraft:zombie
        - name: x
          in: query
          schema:
            type: number
            format: double
          description: Finite absolute center x coordinate; supply x, y, and z together.
        - name: y
          in: query
          schema:
            type: number
            format: double
          description: Finite absolute center y coordinate; supply x, y, and z together.
        - name: z
          in: query
          schema:
            type: number
            format: double
          description: Finite absolute center z coordinate; supply x, y, and z together.
        - name: radius
          in: query
          schema:
            type: number
            format: double
            minimum: 0
          description: Finite inclusive radius in blocks; requires x, y, and z.
        - name: sort
          in: query
          schema:
            type: string
            enum: [arbitrary, nearest, furthest]
            default: arbitrary
          description: Distance sorting requires x, y, and z, with or without radius.
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
          description: Maximum number returned after filtering and sorting. Omit for no limit.
      responses:
        '200':
          description: A snapshot of the selected entities
          content:
            application/json:
              schema:
                type: object
                required: [entities]
                properties:
                  entities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entity'
        '400':
          description: Invalid query, malformed dimension ID, or malformed or unregistered entity type ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: summon
      summary: Summon one entity in a loaded dimension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummonRequest'
      responses:
        '200':
          description: The summoned entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummonResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An entity with the supplied NBT UUID already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/entities/{uuid}/kill:
    post:
      operationId: killEntity
      summary: Kill one loaded entity by UUID
      description: >-
        Performs Minecraft's kill operation in the specified dimension, including
        normal death processing. An absent, unloaded, or already dead entity
        returns killedEntities equal to zero. No chunks are loaded for this request.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillEntityRequest'
      responses:
        '200':
          description: The number of entities killed (zero or one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/entities/kill:
    post:
      operationId: killEntities
      summary: Kill loaded entities by exact type, optionally within a sphere
      description: >-
        The entity field is an exact registered entity type ID. Supply x, y, z,
        and radius together for an inclusive sphere measured from each entity's
        position in absolute coordinates. Omit all four to select all loaded
        entities of that type in the specified dimension. No chunks are loaded.
        Only entities selected before killing starts are processed; new drops or
        smaller mobs spawned by death processing are not added to the selection.
        An empty selection returns killedEntities equal to zero.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillEntitiesRequest'
      responses:
        '200':
          description: The number of entities killed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/time:
    get:
      operationId: getTime
      summary: Read a world clock's total elapsed ticks
      parameters:
        - name: clock
          in: query
          schema:
            $ref: '#/components/schemas/WorldClockId'
      responses:
        '200':
          $ref: '#/components/responses/TimeResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TimeNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: setTime
      summary: Set total ticks or advance a world clock to a time marker
      description: >-
        An integer sets the clock's total elapsed ticks. A time marker such as
        day, noon, night, or midnight advances to its next occurrence, as in
        Minecraft 26.3's /time set command. Custom time marker IDs are supported.
        Clock time is shared across dimensions using that clock. Game time and
        the clock's paused state and rate are unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTimeRequest'
            example:
              time: day
      responses:
        '200':
          $ref: '#/components/responses/TimeResult'
        '409':
          description: TIME_ALREADY_AT_MARKER if the clock is already at the requested marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TimeNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/time/add:
    post:
      operationId: addTime
      summary: Add signed ticks to a world clock
      description: >-
        Adds a signed 32-bit tick count, matching Minecraft 26.3's /time add
        command. Negative values rewind the clock; the result is clamped at zero.
        Game time and the clock's paused state and rate are unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTimeRequest'
            example:
              ticks: 6000
      responses:
        '200':
          $ref: '#/components/responses/TimeResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TimeNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Entity:
      type: object
      description: A snapshot of a loaded, alive entity, captured on the server thread.
      required: [uuid, entity, dimension, x, y, z, yaw, pitch, name, health]
      properties:
        uuid:
          type: string
          format: uuid
        entity:
          type: string
          description: Resolved namespaced entity type ID.
          example: minecraft:zombie
        dimension:
          type: string
          description: Resolved namespaced dimension ID.
          example: minecraft:overworld
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        z:
          type: number
          format: double
        yaw:
          type: number
          description: Horizontal rotation in degrees.
        pitch:
          type: number
          description: Vertical rotation in degrees.
        name:
          type: string
          description: Plain-text entity name, including a custom name when present.
        health:
          type: [number, 'null']
          description: Current health points, or null for entities without health.
    WorldClockId:
      type: string
      minLength: 1
      default: minecraft:overworld
      description: World clock ID; an omitted namespace resolves to minecraft.
      example: minecraft:overworld
    SetTimeRequest:
      type: object
      required: [time]
      additionalProperties: false
      properties:
        clock:
          $ref: '#/components/schemas/WorldClockId'
        time:
          oneOf:
            - type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              description: Absolute total elapsed ticks.
            - type: string
              minLength: 1
              description: >-
                A time marker ID. Vanilla Overworld markers are day, noon, night,
                and midnight. An omitted namespace resolves to minecraft.
              example: day
    AddTimeRequest:
      type: object
      required: [ticks]
      additionalProperties: false
      properties:
        clock:
          $ref: '#/components/schemas/WorldClockId'
        ticks:
          type: integer
          format: int32
          minimum: -2147483648
          maximum: 2147483647
    TimeResult:
      type: object
      required: [clock, ticks]
      additionalProperties: false
      properties:
        clock:
          type: string
          description: Resolved namespaced world clock ID.
          example: minecraft:overworld
        ticks:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Total elapsed ticks, read immediately after the operation.
          example: 25000
    SayRequest:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 256
    SayResult:
      type: object
      additionalProperties: false
      required:
        - message
        - recipients
      properties:
        message:
          type: string
        recipients:
          type: integer
          minimum: 0
    TargetedBlock:
      type: object
      additionalProperties: false
      required: [dimension, x, y, z, block, face, distance]
      properties:
        dimension:
          type: string
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
          description: Namespaced block ID captured before the action.
        face:
          type: string
          enum: [down, up, north, south, west, east]
        distance:
          type: number
          minimum: 0
          description: Distance in blocks from the eye to the hit surface.
    TargetedBlockResponse:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          oneOf:
            - $ref: '#/components/schemas/TargetedBlock'
            - type: 'null'
    PlayerAttackResult:
      type: object
      additionalProperties: false
      required: [swung, target, broken]
      properties:
        swung:
          type: boolean
          description: Whether a new arm swing started; an existing swing may prevent another.
        target:
          oneOf:
            - $ref: '#/components/schemas/TargetedBlock'
            - type: 'null'
        broken:
          type: boolean
          description: Whether the targeted block's type changed during the native attack.
        entity:
          $ref: '#/components/schemas/Entity'
          description: Optional entity snapshot after an entity attack attempt; omitted for block attacks and misses.
    PlayerUseResult:
      type: object
      additionalProperties: false
      required: [used, swung, target, entity]
      properties:
        used:
          type: boolean
          description: Whether the native interaction consumed the action; not a guarantee of growth or item consumption.
        swung:
          type: boolean
          description: Whether a new interaction arm swing started; an existing swing may prevent another.
        target:
          description: Block snapshot before the attempt; null for entities and air. Present even when block interaction passes to in-air use.
          oneOf:
            - $ref: '#/components/schemas/TargetedBlock'
            - type: 'null'
        entity:
          description: Entity snapshot after the attempt, including a refused attempt; null for blocks and air.
          oneOf:
            - $ref: '#/components/schemas/Entity'
            - type: 'null'
    PlayerMiningResult:
      type: object
      additionalProperties: false
      required: [active, target, broken]
      properties:
        active:
          type: boolean
          description: Whether held mining is enabled, including while waiting with no target. Remains true after a break until stopped.
        target:
          description: Current block snapshot, or the block immediately broken by start; null while waiting without a target.
          oneOf:
            - $ref: '#/components/schemas/TargetedBlock'
            - type: 'null'
        broken:
          type: boolean
          description: True only if starting mining immediately broke the block; stop never breaks a block.
    Player:
      type: object
      additionalProperties: false
      required:
        - username
        - uuid
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
    PlayersResponse:
      type: object
      additionalProperties: false
      required:
        - players
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
    GameMode:
      type: string
      enum: [creative, survival]
    SetPlayerGameModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/GameMode'
    PlayerGameMode:
      type: object
      additionalProperties: false
      required: [username, uuid, mode]
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/GameMode'
    PlayerPosition:
      type: object
      additionalProperties: false
      required:
        - username
        - uuid
        - dimension
        - x
        - y
        - z
        - yaw
        - pitch
      properties:
        username:
          type: string
        uuid:
          type: string
          format: uuid
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x:
          type: number
        y:
          type: number
        z:
          type: number
        yaw:
          type: number
        pitch:
          type: number
    TeleportPlayerRequest:
      type: object
      additionalProperties: false
      required:
        - x
        - y
        - z
      properties:
        x:
          type: number
          description: Absolute destination X coordinate
        y:
          type: number
          description: Absolute destination Y coordinate
        z:
          type: number
          description: Absolute destination Z coordinate
        dimension:
          type: string
          description: Loaded destination dimension; omitted to keep the current dimension
          examples:
            - minecraft:overworld
        yaw:
          type: number
          description: Horizontal rotation in degrees; omitted to keep the current yaw
        pitch:
          type: number
          description: Vertical rotation in degrees; omitted to keep the current pitch
    SetBlockRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
        - x
        - y
        - z
        - block
      properties:
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
          examples:
            - minecraft:diamond_block
    GetBlockResult:
      type: object
      additionalProperties: false
      required:
        - dimension
        - x
        - y
        - z
        - block
      properties:
        dimension:
          type: string
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
    SetBlockResult:
      type: object
      additionalProperties: false
      required:
        - changed
        - dimension
        - x
        - y
        - z
        - block
      properties:
        changed:
          type: boolean
        dimension:
          type: string
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        z:
          type: integer
          format: int32
        block:
          type: string
    FillRequest:
      type: object
      description: >-
        The two corners are inclusive and may be supplied in either order. The
        resulting cuboid must contain at most 32,768 blocks.
      additionalProperties: false
      required:
        - dimension
        - x1
        - y1
        - z1
        - x2
        - y2
        - z2
        - block
      properties:
        dimension:
          type: string
          examples:
            - minecraft:overworld
        x1:
          type: integer
          format: int32
        y1:
          type: integer
          format: int32
        z1:
          type: integer
          format: int32
        x2:
          type: integer
          format: int32
        y2:
          type: integer
          format: int32
        z2:
          type: integer
          format: int32
        block:
          type: string
          examples:
            - minecraft:stone
    FillResult:
      type: object
      additionalProperties: false
      required:
        - changedBlocks
        - dimension
        - x1
        - y1
        - z1
        - x2
        - y2
        - z2
        - block
      properties:
        changedBlocks:
          type: integer
          format: int32
          minimum: 0
          maximum: 32768
        dimension:
          type: string
        x1:
          type: integer
          format: int32
        y1:
          type: integer
          format: int32
        z1:
          type: integer
          format: int32
        x2:
          type: integer
          format: int32
        y2:
          type: integer
          format: int32
        z2:
          type: integer
          format: int32
        block:
          type: string
    SummonRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
        - entity
        - x
        - y
        - z
      properties:
        dimension:
          type: string
          examples:
            - minecraft:overworld
        entity:
          type: string
          examples:
            - minecraft:arrow
        x:
          type: number
        y:
          type: number
        z:
          type: number
        nbt:
          $ref: '#/components/schemas/NbtCompound'
    SummonResult:
      type: object
      additionalProperties: false
      required:
        - uuid
        - entity
        - dimension
        - x
        - y
        - z
      properties:
        uuid:
          type: string
          format: uuid
        entity:
          type: string
        dimension:
          type: string
        x:
          type: number
        y:
          type: number
        z:
          type: number
    KillEntityRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
      properties:
        dimension:
          type: string
          minLength: 1
          examples:
            - minecraft:overworld
    KillEntitiesRequest:
      type: object
      additionalProperties: false
      required:
        - dimension
        - entity
      dependentRequired:
        x: [y, z, radius]
        y: [x, z, radius]
        z: [x, y, radius]
        radius: [x, y, z]
      properties:
        dimension:
          type: string
          minLength: 1
          examples:
            - minecraft:overworld
        entity:
          type: string
          minLength: 1
          description: Exact registered entity type ID
          examples:
            - minecraft:zombie
        x:
          type: number
          description: Finite absolute center X coordinate
        y:
          type: number
          description: Finite absolute center Y coordinate
        z:
          type: number
          description: Finite absolute center Z coordinate
        radius:
          type: number
          minimum: 0
          description: Finite non-negative radius; the boundary is included
    KillResult:
      type: object
      additionalProperties: false
      required:
        - dimension
        - killedEntities
      properties:
        dimension:
          type: string
        killedEntities:
          type: integer
          format: int32
          minimum: 0
    NbtCompound:
      type: object
      description: >-
        A plain JSON object converted recursively to an NBT compound. JSON integers
        become IntTag or LongTag, floating-point values become DoubleTag, booleans
        become ByteTag, and null is not supported.
      additionalProperties:
        $ref: '#/components/schemas/NbtValue'
    NbtValue:
      anyOf:
        - $ref: '#/components/schemas/NbtCompound'
        - type: array
          items:
            $ref: '#/components/schemas/NbtValue'
        - type: string
        - type: boolean
        - type: integer
          format: int64
        - type: number
          format: double
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    TimeResult:
      description: The world clock's current total elapsed ticks
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TimeResult'
    TimeNotFound:
      description: >-
        CLOCK_NOT_FOUND if the clock does not exist, TIME_MARKER_NOT_FOUND if a
        set request names a marker absent from that clock, or ROUTE_NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: A Bearer token is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The Bearer token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: The route does not accept the request method
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: The server could not complete the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorldNotLoaded:
      description: No Minecraft world is currently loaded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Timeout:
      description: The Minecraft server thread did not respond before the deadline
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
