openapi: 3.1.0
info:
  title: boxloom internal API
  version: 0.1.0
  description: >-
    The versioned, private API shared by the boxloom Fabric mod and language SDKs.
    Bearer authentication is optional on loopback and required for a non-loopback
    listener. The API is intended for loopback or a trusted private network.
servers:
  - url: http://127.0.0.1:28886
security:
  - bearerAuth: []
  - {}
paths:
  /v1/events:
    get:
      operationId: watchEvents
      summary: Stream player events
      description: >-
        Opens a Server-Sent Events stream. With no Last-Event-ID, the stream starts
        at the current live position. Reconnecting with the last received event ID
        replays retained events after that cursor. Event IDs are opaque and valid
        only while the corresponding server session and retained history remain
        available. Chat, death, and player action events share one cursor sequence and a
        combined retention limit of 1,024 events. The stream sends retry fields
        and comment heartbeats. All event types are sent on this endpoint;
        consumers distinguish them by their matching SSE event name and JSON type.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Opaque ID of the last event completely processed by the caller
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: >-
            A live SSE stream containing stream.ready, chat.message, player.death,
            player.swing, block.attack, block.use, item.use, stream.reset, and error events
          headers:
            Cache-Control:
              description: Prevents intermediaries from caching or transforming the stream
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                chatMessage:
                  summary: One player chat event
                  value: |-
                    retry: 1000

                    event: chat.message
                    id: 2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:42
                    data: {"type":"chat.message","id":"2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:42","timestamp":"2026-08-14T00:00:00Z","message":"hello","player":{"username":"Steve","uuid":"58f6e634-15d9-4d4c-8ca0-8a4b23fe38af"}}
                playerDeath:
                  summary: Player death with a snapshot of the death location
                  value: |-
                    event: player.death
                    id: 2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:43
                    data: {"type":"player.death","id":"2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:43","timestamp":"2026-08-14T00:00:01Z","message":"Steve fell from a high place","player":{"username":"Steve","uuid":"58f6e634-15d9-4d4c-8ca0-8a4b23fe38af"},"dimension":"minecraft:overworld","x":1.5,"y":64.0,"z":-2.25}
                playerSwing:
                  summary: An attack swing, including attacks that miss
                  value: |-
                    event: player.swing
                    id: 2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:44
                    data: {"type":"player.swing","id":"2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:44","timestamp":"2026-11-06T00:00:00Z","player":{"username":"Steve","uuid":"58f6e634-15d9-4d4c-8ca0-8a4b23fe38af"},"dimension":"minecraft:overworld","x":1.5,"y":64.0,"z":-2.25,"hand":"main_hand","item":"minecraft:diamond_sword"}
                blockUse:
                  summary: A block-use attempt with an empty off hand
                  value: |-
                    event: block.use
                    id: 2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:45
                    data: {"type":"block.use","id":"2f5e31b8-1a7b-40ec-a17e-3daf8e2938a0:45","timestamp":"2026-11-06T00:00:01Z","player":{"username":"Steve","uuid":"58f6e634-15d9-4d4c-8ca0-8a4b23fe38af"},"dimension":"minecraft:overworld","x":1.5,"y":64.0,"z":-2.25,"hand":"off_hand","item":null,"block":"minecraft:stone","block_x":-2,"block_y":63,"block_z":4,"face":"up"}
        '400':
          description: Last-Event-ID is malformed or ahead of the live stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          description: The Accept header does not allow text/event-stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: >-
            Last-Event-ID belongs to another server session or its following events
            are no longer retained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/chat/messages:
    post:
      operationId: say
      summary: Broadcast a system message to connected players
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SayRequest'
      responses:
        '200':
          description: The message broadcast result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SayResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players:
    get:
      operationId: getPlayers
      summary: List players currently connected to the server
      responses:
        '200':
          description: The connected players in server list order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/position:
    get:
      operationId: getPlayerPosition
      summary: Read a connected player's position and look direction
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      responses:
        '200':
          description: The player position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPosition'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/targeted-block:
    get:
      operationId: getPlayerTargetedBlock
      summary: Read the block under a connected player's crosshair
      description: >-
        Uses the server's latest eye position and view within the player's block
        interaction reach. Entities occlude blocks and fluids are ignored.
        Returns null when no block is targeted, including when an entity is in front.
        The target is a snapshot; a later attack recalculates it on the server thread.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      responses:
        '200':
          description: The server-thread result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetedBlockResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/attack:
    post:
      operationId: attackPlayer
      summary: Attack the targeted block or entity once, or swing at empty space
      description: >-
        Uses the server's latest eye position and view with native block or entity reach. Entities occlude blocks and fluids are ignored.
        Cancels API mining and performs one native block or entity attack. Instant-mine
        and creative blocks may break; other blocks require the separate mining API.
        Native protections, attack range, damage cooldowns, PvP rules and Fabric
        callbacks apply. Entity reach is independent of block reach. Sends the arm
        swing to the player and observers. Piercing weapons return UNSUPPORTED_ATTACK_TARGET.
        Dead, spectator or busy players return PLAYER_CANNOT_ATTACK. An entity snapshot
        is included after an entity attack attempt; damage is not guaranteed.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
            example: {}
      responses:
        '200':
          description: The server-thread result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerAttackResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: PLAYER_CANNOT_ATTACK or UNSUPPORTED_ATTACK_TARGET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type must be application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/use:
    post:
      operationId: usePlayerItem
      summary: Use the main hand on the aimed block or entity, or in the air
      description: >-
        Performs one main-hand use with the server's latest eye position and view.
        Uses native block/entity interaction reach; entities occlude blocks and fluids
        are ignored by the outer raycast. Items such as buckets use their own native
        targeting. No automatic offhand fallback. Cancels API mining. Native item
        consumption, creative rules, cooldowns, spawn protection, world border and
        Fabric cancellation apply. A cancelled interaction is not retried as air use.
        Dead, spectator, already-using or otherwise unable players return PLAYER_CANNOT_USE.
        The result reports native action acceptance, not guaranteed growth or an item
        change. Long-duration items start their native use; this operation does not
        simulate holding and releasing a button. No automatic mutation retries.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
            example: {}
      responses:
        '200':
          description: The server-thread result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerUseResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: PLAYER_CANNOT_USE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type must be application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/mining/start:
    post:
      operationId: startPlayerMining
      summary: Enable continuous held mining
      description: >-
        Returns immediately with active true, like holding the mining button. Waits
        with target null when no block is targeted, and continues to the next block
        after each break with a five-tick delay. Uses native tool speed, drops,
        durability and protection callbacks. Repeating start does not reset progress.
        Target, block-state, tool or selected-slot changes reset block progress;
        item use pauses mining. Protected and unbreakable targets remain intact and
        wait until the aim, block or tool changes. The mode ends on stop_mining,
        attack, death, disconnect, world or game-mode changes, or a competing native
        mining action. The response is a snapshot; broken is true only for an
        immediate creative or instant break and does not turn active off. Later
        breaks are visible through block reads. The player and observers receive
        animation and cracks. This mode only mines blocks; it does not attack entities.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
            example: {}
      responses:
        '200':
          description: The server-thread result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerMiningResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: PLAYER_CANNOT_ATTACK or UNSUPPORTED_ATTACK_TARGET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type must be application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/mining/stop:
    post:
      operationId: stopPlayerMining
      summary: Cancel this player's API mining session
      description: >-
        Idempotent: an inactive session returns active false, target null, broken false.
        An active session is cancelled, including pending native delayed completion,
        and its crack animation is cleared. Target contains the current block's
        snapshot, or null while waiting without a target. This action never breaks a block.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
            example: {}
      responses:
        '200':
          description: The server-thread result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerMiningResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Minecraft could not cancel the mining session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type must be application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/teleport:
    post:
      operationId: teleportPlayer
      summary: Teleport a connected player to absolute coordinates
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeleportPlayerRequest'
      responses:
        '200':
          description: The player's position after teleporting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPosition'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected, the dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Minecraft could not teleport the player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/players/{username}/gamemode:
    post:
      operationId: setPlayerGameMode
      summary: Set a connected player's game mode to creative or survival
      description: >-
        Sets only the named player's mode on the Minecraft server thread and
        returns their mode immediately afterward. Setting the current mode is
        a successful no-op. The player must be connected; player operator
        permissions are not required. Uses the same API authentication as other
        operations. Does not change the world's default game mode.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{3,16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPlayerGameModeRequest'
      responses:
        '200':
          description: The player's game mode after the operation, including a no-op
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGameMode'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The player is not connected, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Minecraft could not apply the requested game mode (GAME_MODE_CHANGE_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/world/blocks:
    get:
      operationId: getBlock
      summary: Get one block from a loaded dimension
      parameters:
        - name: dimension
          in: query
          required: true
          schema:
            type: string
          example: minecraft:overworld
        - name: x
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: y
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: z
          in: query
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The block at the requested position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBlockResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WorldNotLoaded'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: setBlock
      summary: Set one block in a loaded dimension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBlockRequest'
      responses:
        '200':
          description: The result of setting the block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetBlockResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested dimension is not loaded, or the route does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
